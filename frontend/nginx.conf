server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse-proxy all /api/* requests to the backend service.
    # "backend" is the docker-compose service name; port 4000 is the backend's exposed port.
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Forward the request body for POST requests
        proxy_request_buffering off;
    }

    # SPA fallback — serve index.html for any unmatched route so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }
}

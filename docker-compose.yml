
services:


  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Use MONGO_URI from .env file (Atlas), no override here
      MONGO_DB_NAME: ai_jailbreak
      # Allow requests from the nginx frontend container (same compose network)
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    networks:
      - app_net

  # ── Frontend (Vite build → nginx) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app_net

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  app_net:
    driver: bridge

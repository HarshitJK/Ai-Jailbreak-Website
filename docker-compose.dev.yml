# ── Development override ──────────────────────────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Changes vs production:
#   • frontend  → Vite dev server (HMR) on port 5173 instead of nginx on 3000
#   • backend   → uvicorn with --reload, watches /backend for Python changes
#   • Both services bind-mount their source folders from the host

services:

  # ── Frontend: Vite dev server with HMR ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev  # dev-only image — no build step, just npm ci
    command: npm run dev
    ports:
      - "5173:5173"             # Vite HMR port (replaces nginx :3000)
    volumes:
      - ./frontend:/app         # bind mount — edits on host appear instantly
      - /app/node_modules       # keep container node_modules isolated
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    networks:
      - app_net

  # ── Backend: uvicorn with --reload ───────────────────────────────────────────
  backend:
    volumes:
      - ./backend:/backend      # bind mount — Python changes trigger auto-reload
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 4000
      --reload
      --reload-dir /backend/app
